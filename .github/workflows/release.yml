name: Release

on:
    push:
        branches: [ release ]

    workflow_dispatch:

permissions:
    contents: write
    pages: write
    id-token: write

jobs:
    clippy:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   uses: dtolnay/rust-toolchain@nightly
                with:
                    components: clippy
                    target: wasm32-unknown-unknown

            -   name: Cache Cargo
                uses: Swatinem/rust-cache@v2

            -   name: Run clippy on workspace
                run: cargo clippy --workspace -- -D warnings

            -   name: Run clippy for WASM target
                run: cargo clippy --workspace --target wasm32-unknown-unknown --exclude monsoon-cli -- -D warnings

    build:
        needs: clippy
        strategy:
            matrix:
                include:
                    -   os: ubuntu-latest
                        target: x86_64-unknown-linux-gnu
                    -   os: macos-latest
                        target: aarch64-apple-darwin
                    -   os: windows-latest
                        target: x86_64-pc-windows-msvc
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   uses: dtolnay/rust-toolchain@nightly
                with:
                    components: clippy, rustfmt

            -   name: Cache Cargo
                uses: Swatinem/rust-cache@v2

            -   name: Build CLI
                run: cargo build --profile full_release -p monsoon-cli

            -   name: Build Frontend
                run: cargo build --profile full_release -p monsoon-frontend

            -   name: Prepare artifacts
                shell: bash
                run: |
                    mkdir -p artifacts
                    
                    if [ "${{ runner.os }}" = "Windows" ]; then
                      cp target/full_release/cli.exe "artifacts/monsoon-cli-${{ matrix.target }}.exe"
                      cp target/full_release/frontend.exe "artifacts/monsoon-frontend-${{ matrix.target }}.exe"
                    
                      cd artifacts
                      powershell -Command "Compress-Archive -Path monsoon-cli-${{ matrix.target }}.exe -DestinationPath monsoon-cli-${{ matrix.target }}.zip"
                      powershell -Command "Compress-Archive -Path monsoon-frontend-${{ matrix.target }}.exe -DestinationPath monsoon-frontend-${{ matrix.target }}.zip"
                      rm *.exe
                    else
                      if [ "${{ runner.os }}" = "Linux" ]; then
                        cp target/full_release/cli "artifacts/monsoon-cli-${{ matrix.target }}.x86_64"
                        cp target/full_release/frontend "artifacts/monsoon-frontend-${{ matrix.target }}.x86_64"
                    
                        cd artifacts
                        tar -czf "monsoon-cli-${{ matrix.target }}.tar.gz" "monsoon-cli-${{ matrix.target }}.x86_64"
                        tar -czf "monsoon-frontend-${{ matrix.target }}.tar.gz" "monsoon-frontend-${{ matrix.target }}.x86_64"
                        rm "monsoon-cli-${{ matrix.target }}.x86_64" "monsoon-frontend-${{ matrix.target }}.x86_64"
                      else
                        cp target/full_release/cli "artifacts/monsoon-cli-${{ matrix.target }}"
                        cp target/full_release/frontend "artifacts/monsoon-frontend-${{ matrix.target }}"
                    
                        cd artifacts
                        tar -czf "monsoon-cli-${{ matrix.target }}.tar.gz" "monsoon-cli-${{ matrix.target }}"
                        tar -czf "monsoon-frontend-${{ matrix.target }}.tar.gz" "monsoon-frontend-${{ matrix.target }}"
                        rm "monsoon-cli-${{ matrix.target }}" "monsoon-frontend-${{ matrix.target }}"
                      fi
                    fi

            -   name: Upload artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: binaries-${{ matrix.target }}
                    path: artifacts/

    release:
        needs:
            - build
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   name: Get version
                id: version
                run: |
                    VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
                    echo "version=$VERSION" >> $GITHUB_OUTPUT

            -   name: Download all artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: binaries-*
                    path: artifacts
                    merge-multiple: true

            -   name: Create Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: v${{ steps.version.outputs.version }}
                    name: v${{ steps.version.outputs.version }}
                    files: artifacts/*
                    generate_release_notes: true

    deploy-web:
        runs-on: ubuntu-latest
        needs: clippy
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   uses: dtolnay/rust-toolchain@nightly
                with:
                    targets: wasm32-unknown-unknown

            -   name: Cache Cargo
                uses: Swatinem/rust-cache@v2

            -   name: Install wasm tooling
                uses: taiki-e/install-action@v2
                with:
                    tool: trunk,wasm-bindgen

            -   name: Install binaryen
                run: |
                    curl -L https://github.com/WebAssembly/binaryen/releases/download/version_131/binaryen-version_131-x86_64-linux.tar.gz \
                      -o binaryen.tar.gz
                    tar -xf binaryen.tar.gz
                    sudo mv binaryen-version_*/bin/* /usr/local/bin/

            -   name: Build frontend with trunk
                working-directory: frontend
                run: trunk build --cargo-profile full_release

            -   name: Upload Pages artifact
                uses: actions/upload-pages-artifact@v5
                with:
                    path: frontend/dist

            -   name: Deploy to GitHub Pages
                id: deploy
                uses: actions/deploy-pages@v5

    publish-crates:
        needs: release
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7

            -   uses: dtolnay/rust-toolchain@nightly

            -   name: Publish crates to crates.io
                env:
                    CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                run: |
                    publish_crate() {
                      local crate="$1"
                      echo "Publishing $crate..."
                      OUTPUT=$(cargo publish -p "$crate" 2>&1) && {
                        echo "✅ $crate published successfully"
                        return 0
                      }
                      if echo "$OUTPUT" | grep -q "already uploaded"; then
                        echo "::warning::$crate is already published at this version, skipping"
                        return 0
                      fi
                      echo "::error::Failed to publish $crate: $OUTPUT"
                      return 1
                    }
                    
                    wait_for_crate() {
                      local crate="$1"
                      local version="$2"
                      echo "Waiting for $crate@$version to appear on crates.io..."
                      for i in $(seq 1 10); do
                        if cargo search "$crate" 2>/dev/null | grep -q "\"$version\""; then
                          echo "✅ $crate@$version is available on crates.io"
                          return 0
                        fi
                        echo "  Attempt $i/10: not yet available, waiting 15s..."
                        sleep 15
                      done
                      echo "::warning::Timed out waiting for $crate@$version, proceeding anyway"
                    }
                    
                    echo "Login in to crates.io"
                    echo $CARGO_REGISTRY_TOKEN | cargo login
                    
                    VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
                    
                    publish_crate monsoon-macro
                    wait_for_crate monsoon-macro "$VERSION"
                    
                    publish_crate monsoon-core
                    wait_for_crate monsoon-core "$VERSION"
                    
                    publish_crate monsoon-db
                    wait_for_crate monsoon-db "$VERSION"
                    
                    publish_crate monsoon-default-renderers
                    wait_for_crate monsoon-default-renderers "$VERSION"
                    
                    publish_crate monsoon-cli
                    wait_for_crate monsoon-cli "$VERSION"
                    
                    publish_crate monsoon-frontend

    publish-aur:
        needs: release
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest

        steps:
            -   name: Install tools
                run: |
                    pacman -Syu --noconfirm archlinux-keyring
                    pacman -S --noconfirm pacman-contrib

            -   name: Setup SSH
                run: |
                    mkdir -p ~/.ssh
                    echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
                    chmod 600 ~/.ssh/aur
                    
                    ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
                    
                    cat >> ~/.ssh/config <<EOF
                    Host aur.archlinux.org
                      IdentityFile ~/.ssh/aur
                      StrictHostKeyChecking yes
                    EOF

            -   name: Setup git
                run: |
                    git config --global user.name "GitHub Actions"
                    git config --global user.email "actions@github.com"

            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Get version
                id: version
                run: |
                    VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            -   name: Update monsoon-emulator
                run: |
                    git clone ssh://aur@aur.archlinux.org/monsoon-emulator.git
                    cd monsoon-emulator
                    
                    sed -i \
                      "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" \
                      PKGBUILD
                    
                    updpkgsums
                    makepkg --printsrcinfo > .SRCINFO
                    
                    if git diff --cached --quiet && git diff --quiet; then
                        echo "No changes"
                        exit 0
                    fi
                    
                    git commit -am "Update to ${{ steps.version.outputs.version }}"
                    git push

            -   name: Update monsoon-emulator-bin
                run: |
                    git clone ssh://aur@aur.archlinux.org/monsoon-emulator-bin.git
                    cd monsoon-emulator-bin
                    
                    sed -i \
                      "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" \
                      PKGBUILD
                    
                    updpkgsums
                    makepkg --printsrcinfo > .SRCINFO
                    
                    if git diff --cached --quiet && git diff --quiet; then
                        echo "No changes"
                        exit 0
                    fi
                    
                    git commit -am "Update to ${{ steps.version.outputs.version }}"
                    git push
